<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alija lernt Deutsch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#EAF6F4;--ink:#16324F;--card:#fff;--a:#1F8A8A;--sun:#FFC83D;--coral:#FF7A59;--art:#2F6FDE;--verb:#D6452B;--ok:#2E9E5B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10252F;--ink:#E8F4F2;--card:#1B3744;--art:#7FB0FF;--verb:#FF9B84}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',Verdana,sans-serif;font-weight:600;font-size:18px}
body.dys{font-family:'Comic Sans MS','Trebuchet MS',Verdana,sans-serif;letter-spacing:.04em}
h1,h2,.big{font-family:'Baloo 2','Nunito',sans-serif;margin:.2em 0}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border-radius:28px;padding:18px;margin:12px 0;box-shadow:0 3px 0 rgba(22,50,79,.12)}
.btn{min-height:64px;min-width:64px;border:3px solid var(--ink);background:var(--sun);color:#16324F;border-radius:22px;font:inherit;font-weight:800;font-size:1.1em;padding:10px 18px;cursor:pointer}
.btn:focus-visible,.opt:focus-visible,nav button:focus-visible{outline:4px solid var(--art);outline-offset:3px}
.btn.alt{background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .btn{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:110px;font-size:1.05em}
.grid .btn span{font-size:2.2em}
.opt{min-height:96px;border:3px solid var(--ink);border-radius:24px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.3em;cursor:pointer}
.opt .e{font-size:2.8em;display:block}
.opt.good{background:#CDEFD9;border-color:var(--ok)}
.opt.try{animation:wob .4s}
.reduced .opt.try{animation:none}
@keyframes wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .5s}.reduced .pop{animation:none}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.huge{font-size:7em;line-height:1;text-align:center;font-family:'Baloo 2',sans-serif}
.pic{font-size:5em;text-align:center}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tile{min-width:64px;min-height:64px;border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:#16324F;font:inherit;font-weight:800;font-size:1.5em;padding:6px 14px;cursor:pointer}
.slot{min-width:56px;min-height:64px;border-bottom:5px solid var(--ink);font-size:1.8em;font-weight:800;text-align:center;font-family:'Baloo 2',sans-serif}
.w{padding:8px 14px;border-radius:16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.3em;cursor:pointer}
.col .w.art{border-color:var(--art);border-bottom-width:8px}.col .w.verb{border-color:var(--verb);border-style:dashed;border-width:3px 3px 8px}
.fino{display:flex;gap:10px;align-items:center}.fino .f{font-size:3.2em}
.bubble{background:var(--card);border-radius:20px;padding:10px 14px;flex:1;border:3px solid var(--a)}
.bar{height:18px;background:rgba(22,50,79,.15);border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink)}
nav button{border:0;background:none;color:var(--ink);font:inherit;font-size:.62em;font-weight:800;min-width:44px;min-height:52px;cursor:pointer;border-radius:14px}
nav button b{display:block;font-size:2.2em}nav button.on{background:var(--sun);color:#16324F}
input{font:inherit;font-size:1.3em;padding:14px;border-radius:18px;border:3px solid var(--ink);width:100%;background:var(--card);color:var(--ink)}
label.t{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:10px}
label.t input{width:34px;height:34px}
.garden{font-size:2.4em;line-height:1.4;text-align:center;min-height:120px}
header.top{background:#fff;max-width:640px;margin:0 auto;padding:6px 10px;border-radius:0 0 28px 28px}header.top img{width:100%;height:auto;display:block}
.av{width:76px;height:76px;border-radius:50%;object-fit:cover;border:4px solid var(--a);flex:none}
select,textarea{font:inherit;padding:10px;border-radius:14px;border:3px solid var(--ink);background:var(--card);color:var(--ink);max-width:100%}
.sheet{background:#fff;color:#000;border:2px solid #000;border-radius:8px;padding:16px}.sheet h2{font-size:1.3em}
.tr{display:inline-block;font:800 64px 'Baloo 2',Verdana,sans-serif;color:#fff;-webkit-text-stroke:2px #888;letter-spacing:.08em;margin:4px 8px}
.ln{border-bottom:2px solid #000;height:48px;margin:8px 0}.gray{filter:grayscale(1) opacity(.45)}
.bx{border:3px dashed #000;height:170px;display:flex;align-items:flex-end;justify-content:center;margin:10px 0}
@media print{header.top,nav,.fino,.noprint{display:none!important}html,body{background:#fff!important}main{padding:0!important;max-width:none!important}.sheet{border:0}.card{box-shadow:none}}
</style></head><body>

 return `<div class="card center"><div class="huge">${c}${c==='ß'?'':c.toLowerCase()}</div>${ex?`<div class="pic">${ex[1]}</div><h2>${c} wie ${ex[0]}</h2>`:'<p>&nbsp;</p>'}${speakBtn(ex?c+' wie '+ex[0]:c)}<div class="row"><button class="btn alt" aria-label="Zurück" onclick="li=(li+29)%30;render()">◀</button><button class="btn" aria-label="Weiter" onclick="li=(li+1)%30;render()">▶</button></div><button class="btn alt" onclick="go('games')">🎮 Spielen</button> <button class="btn" onclick="done('learn')">✔ Fertig</button></div>`}
function words(){return `<h2>Wörter</h2><div class="grid">${W.map(w=>`<button class="opt" onclick="S.words['${w[0]}']=1;save();speak('${w[0]}')"><span class="e">${w[1]}</span>${w[0]}</button>`).join('')}</div>`}
function games(){if(cur)return cur();return `<h2>Spiele</h2><div class="grid"><button class="btn" onclick="cur=gMatch;render()"><span>🔡</span>Buchstabe suchen</button><button class="btn" onclick="cur=gBuild;render()"><span>🧱</span>Wort bauen</button><button class="btn" onclick="cur=gListen;render()"><span>👂</span>Hören &amp; Wählen</button><button class="btn" onclick="go('sents')"><span>🚂</span>Satz-Zug</button><button class="btn" onclick="cur=gScratch;render()"><span>🧽</span>Radieren</button><button class="btn" onclick="go('sheets')"><span>🖨️</span>Arbeitsblätter</button></div>`}
let tgt=null;
function gMatch(){if(!tgt)tgt=pick(W);const o=sh([tgt,...sh(W.filter(w=>w!==tgt)).slice(0,2)]);
 return choice(`Welches Bild passt zu <b>${tgt[0][0]}</b>?`,tgt[0][0]+' wie '+tgt[0],o.map(w=>({e:w[1],ok:w===tgt})),null,tgt[0][0])}
function gListen(){if(!tgt){tgt=pick(W);setTimeout(()=>speak(tgt[0]),300)}const o=sh([tgt,...sh(W.filter(w=>w!==tgt)).slice(0,3)]);
 return choice('Wo ist '+(tgt?'das Wort?':''),tgt[0],o.map(w=>({e:w[1],ok:w===tgt})),null,tgt[0])}
let bw=null,bs=[];
function gBuild(){if(!bw){bw=pick(W.filter(w=>w[0].length<=5));bs=[];bw.p=sh(bw[0].split('').map((c,i)=>({c,i})))}
 const used=bs.map(x=>x.i);
 return `<div class="card center"><div class="pic">${bw[1]}</div>${speakBtn(bw[0])}<div class="row">${bw[0].split('').map((c,i)=>`<div class="slot">${bs[i]?bs[i].c:''}</div>`).join('')}</div><div class="row">${bw.p.map(x=>`<button class="tile" ${used.includes(x.i)?'disabled style="opacity:.3"':''} onclick="bTap(${x.i})">${x.c}</button>`).join('')}</div><button class="btn alt" onclick="bs=[];render()">↩ Neu</button></div>`}
function bTap(i){const x=bw.p.find(p=>p.i===i);bs.push(x);speak(x.c);if(bs.length===bw[0].length){if(bs.map(a=>a.c).join('')===bw[0]){S.words[bw[0]]=1;praise();speak(bw[0]);render();setTimeout(()=>{bw=null;if(!nxt('games'))render()},1600);return}else{miss(bw[0]);bs=[]}}render()}
let sI=0,sP=[],sD=[];
function sents(){const s=SENT[sI%SENT.length];if(!sP.length&&!sD.length)sP=sh(s.slice(0,-1));const full=s.slice(0,-1).join(' ')+'.';
 const cls=w=>S.set.col?(ART.includes(w)?'art':VERB.includes(w)?'verb':''):'';
 return `<h2>Satz-Zug 🚂</h2><div class="card center col"><div class="pic">${s[s.length-1]}</div><div class="row">${sD.map(w=>`<span class="w ${cls(w)}">${w}</span>`).join('')||'<span class="slot" style="min-width:200px"></span>'}</div><div class="row">${sP.map(w=>`<button class="w ${cls(w)}" onclick="sTap('${w}')">${w}</button>`).join('')}</div>${sD.length?'<button class="btn alt" onclick="sP=[];sD=[];render()">↩ Neu</button>':''}</div>`}
function sTap(w){const s=SENT[sI%SENT.length].slice(0,-1);if(s[sD.length]===w){sD.push(w);sP.splice(sP.indexOf(w),1);speak(w);if(!sP.length){praise();S.sents++;speak(s.join(' '));save();render();setTimeout(()=>{sI++;sD=[];sP=[];if(!nxt('sents'))render()},2200);return}}else{miss(w)}render()}
let pg=0,q=false;
function story(){if(q)return choice('Wo spielt Milo?','Wo spielt Milo?',sh([{e:'🌳',l:'im Garten',ok:1},{e:'🚗',l:'im Auto',ok:0},{e:'🏫',l:'in der Schule',ok:0}]),null,'Milo');
 const p=STORY[pg];return `<h2>Milo</h2><div class="card center"><div class="huge" style="font-size:6em">${p[0]}</div><p class="col">${p[1].split(' ').map(w=>`<button class="w" onclick="speak('${w.replace('.','')}')">${w}</button>`).join(' ')}</p>${speakBtn(p[1])}<div class="row"><button class="btn alt" aria-label="Zurück" ${pg?'':'disabled'} onclick="pg--;render()">◀</button><button class="btn" aria-label="Weiter" onclick="if(pg<STORY.length-1){pg++}else{q=true;pg=0}render()">▶</button></div></div>`}
function stars(){const n=Math.floor(S.stars/5);return `<h2>Mein Garten</h2><div class="card garden" aria-label="Garten">${Array.from({length:n},(_, i)=>GARDEN[i%GARDEN.length]).join(' ')||'🌱'}</div><div class="card center"><div class="big" style="font-size:2.4em">⭐ ${S.stars}</div><p class="garden" style="min-height:0">${S.stickers.join(' ')}</p></div><div class="card">${BADGE.map(b=>`<p>${S.stars>=b[0]?b[1]:'🔒 ?'}</p>`).join('')}</div>`}
let unl=false;
function adult(){if(!unl)return `<div class="card center"><h2>🔒 Eltern</h2><p>Was ist 3 + 4?</p><input id="pin" inputmode="numeric" aria-label="Antwort"><div class="row"><button class="btn" onclick="if($('#pin').value==='7'){unl=true;render()}else{say('Falsch.');render()}">OK</button></div></div>`;
 const tg=(k,l)=>`<label class="t">${l}<input type="checkbox" ${S.set[k]?'checked':''} onchange="S.set['${k}']=this.checked?1:0;save();render()"></label>`;
 const wc=Object.keys(S.words).length,lc=Object.keys(S.letters).length,ms=Object.entries(S.mist).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]).join(', ')||'–';
 const wk=Array.from({length:7},(_,i)=>{const d=new Date(Date.now()-i*864e5).toDateString();return S.days[d]||0}).reverse().join(' · ');
 return `<h2>Eltern &amp; Lehrer</h2><div class="card"><p>Schüler: <b>${S.name}</b></p><p>Klasse: <b>${S.cls}</b></p><p>Lehrerin: <b>${S.teacher}</b></p></div><div class="card"><p>Buchstaben: <b>${lc}/30</b></p><p>Wörter: <b>${wc}/20</b></p><p>Sätze: <b>${S.sents}</b></p><p>Geschichte: <b>${S.story?'fertig':'offen'}</b></p><p>Lernzeit: <b>${S.mins} Min.</b></p><p>Häufige Fehler: <b>${ms}</b></p><p>Sterne (7 Tage): <b>${wk}</b></p></div><div class="card">${tg('sound','Ton')}${tg('slow','Immer langsam sprechen')}${tg('anim','Animationen')}${tg('dys','Leseschrift (Dyslexie)')}${tg('col','Farbcodierung Grammatik')}</div>${planCards()}<div class="row noprint"><button class="btn alt" onclick="unl=false;go('home')">Sperren</button></div>`}

const DAY=['Mo','Di','Mi','Do','Fr'],ACT=[['learn','🔤 Buchstaben'],['words','🐶 Wörter'],['sents','🧩 Sätze'],['games','🎮 Spiele'],['story','📖 Geschichte'],['sheets','🖨️ Arbeitsblatt']];
const wk=i=>new Date(Date.now()-((new Date().getDay()+6)%7)*864e5+i*864e5).toDateString();
function nxt(t){rc++;if(rc>=5){rc=0;done(t);return true}return false}
function done(t){endBack=t;rated=0;const k=DAY[new Date().getDay()-1];if(k&&S.plan[k]===t)S.pdone[new Date().toDateString()]=1;save();scr='end';cur=null;say('Du hast es geschafft!');speak('Du hast es geschafft!');render()}
function endScr(){return `<div class="card center"><div class="huge pop">🎉</div><h1>Super, ${S.name}!</h1><p>Tippe auf dein Geschenk:</p><button class="opt" style="width:60%" id="gf" onclick="gift()"><span class="e">🎁</span></button></div><div class="card"><h2>👩‍🏫 Bewertung · ${S.teacher}</h2><div class="row" id="rt">${[1,2,3,4,5].map(n=>`<button class="tile" onclick="rate(${n})">${n}⭐</button>`).join('')}</div></div><div class="row"><button class="btn" onclick="go(endBack)">Weiter ▶</button></div>`}
function gift(){const e=pick(['🎈','🦄','🚀','🍦','🐬','🏆','🎸','⚽']);S.stickers.push(e);save();speak('Toll!');const b=$('#gf');b.innerHTML=`<span class="e pop">${e}</span>Toll!`;b.disabled=true;b.insertAdjacentHTML('afterend','<div class="garden pop">🎈🎉🎊🎈🎉🎊</div>')}
function rate(n){if(rated)return;rated=1;S.rates.push({ts:Date.now(),t:endBack,n});save();$('#rt').innerHTML='<b>Danke! '+'⭐'.repeat(n)+'</b>'}
function gScratch(){if(!scp)scp=pick(W);window.post=initCv;return `<div class="card center"><h2>Radiere das Bild! Welcher Buchstabe?</h2><div style="position:relative;width:260px;height:260px;margin:auto"><div class="huge" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9em">${scp[0][0]}</div><canvas id="cv" width="260" height="260" style="position:absolute;inset:0;touch-action:none;border-radius:24px"></canvas></div><h2 id="lt">&nbsp;</h2><button class="btn" id="nx" style="display:none" onclick="scp=null;if(!nxt('games'))render()">Weiter ▶</button></div>`}
function initCv(){const cv=$('#cv'),x=cv.getContext('2d');x.fillStyle='#BFE3F5';x.fillRect(0,0,260,260);x.font='150px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(scp[1],130,140);x.globalCompositeOperation='destination-out';let d=0,rv=0;const m=e=>{if(!d)return;const r=cv.getBoundingClientRect();x.beginPath();x.arc((e.clientX-r.left)*260/r.width,(e.clientY-r.top)*260/r.height,26,0,7);x.fill()};cv.onpointerdown=e=>{d=1;try{cv.setPointerCapture(e.pointerId)}catch(_){}m(e)};cv.onpointermove=m;cv.onpointerup=()=>{d=0;if(rv)return;const p=x.getImageData(0,0,260,260).data;let n=0;for(let i=3;i<p.length;i+=64)if(!p[i])n++;if(n*64/p.length>.35){rv=1;x.clearRect(0,0,260,260);praise();fino_upd();speak(scp[0][0]+' wie '+scp[0]);$('#nx').style.display='';$('#lt').textContent=scp[0][0]+' wie '+scp[0]}}}
function sheets(){const ex=W.find(w=>w[0][0]===shl)||['',''],has=!!ex[0],word=has?ex[0]:shl;
const tr=Array(5).fill(`<span class="tr">${shl}${shl==='ß'?'':shl.toLowerCase()}</span>`).join(''),ln='<div class="ln"></div>',pic=`<div class="pic gray">${ex[1]}</div>`;
const B={trace:`<h2>Buchstabe ${shl} nachspuren</h2><div>${tr}</div><div>${tr}</div>${ln}${ln}`,draw:`<h2>Male das Bild an</h2>${pic}<div class="bx">Male dein eigenes Bild</div><div class="tr">${word}</div>${ln}`,write:`<h2>Schreibe das Wort</h2>${pic}<div class="tr">${word}</div><div class="tr">${word}</div>${ln}${ln}`};
return `<div class="card noprint"><h2>🖨️ Arbeitsblätter</h2><label class="t">Buchstabe<select onchange="shl=this.value;render()">${L.map(c=>`<option ${c===shl?'selected':''}>${c}</option>`).join('')}</select></label><label class="t">Blatt<select onchange="sht=this.value;render()">${[['trace','Nachspuren'],['draw','Malen'],['write','Wort schreiben']].map(o=>`<option value="${o[0]}" ${sht===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><div class="row"><button class="btn" onclick="window.print()">🖨️ Drucken</button></div></div><div class="sheet"><p><b>Name: ${S.name}</b> · Klasse ${S.cls} · ${S.teacher} · Datum: ________</p>${B[sht]}</div>`}
function todayPlan(){const a=ACT.find(x=>x[0]===S.plan[DAY[new Date().getDay()-1]]);return a?`<div class="card"><b>📅 Heute:</b> <button class="btn" onclick="go('${a[0]}')">${a[1]}</button></div>`:''}
function planCards(){const t0=new Date(wk(0)).getTime(),r=S.rates.filter(x=>x.ts>=t0),avg=r.length?(r.reduce((s,x)=>s+x.n,0)/r.length).toFixed(1):'–',dn=DAY.filter((d,i)=>S.pdone[wk(i)]).length,pl=DAY.filter(d=>S.plan[d]).length;
return `<div class="card"><h2>📅 Wochenplan</h2>${DAY.map((d,i)=>`<label class="t"><b>${d}</b><select onchange="S.plan['${d}']=this.value;save()"><option value="">–</option>${ACT.map(a=>`<option value="${a[0]}" ${S.plan[d]===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><input type="checkbox" aria-label="erledigt" ${S.pdone[wk(i)]?'checked':''} onchange="S.pdone[wk(${i})]=this.checked?1:0;save()"></label>`).join('')}</div><div class="card"><h2>📝 Wochenbewertung</h2><p>Erledigt: <b>${dn}/${pl}</b></p><p>Bewertung ${S.teacher}: <b>${avg} ⭐</b> (${r.length}×)</p><textarea rows="3" style="width:100%" placeholder="Notiz" onchange="S.note=this.value;save()">${S.note}</textarea><div class="row noprint"><button class="btn" onclick="window.print()">🖨️ Bericht drucken</button></div></div>`}

const WM='Hallo Alija! Es ist Zeit zum Lernen!';
function welcome(){return `<div class="card center"><img class="av" style="width:150px;height:150px" src="${AV}" alt="Alija"><h1>Hallo, Alija!</h1><h2>Es ist Zeit zum Lernen! 📚</h2><div class="row"><button class="btn" onclick="hi()">🔊 Los geht's ▶</button></div><div class="row"><button class="btn alt" onclick="speak(WM)">🔊 Hören</button></div></div>`}
function hi(){welcomed=1;say('Hallo, Alija! Es ist Zeit zum Lernen!');speak(WM);render()}
setTimeout(()=>{if(!welcomed)speak(WM)},700);
render();
</script></body></html>
